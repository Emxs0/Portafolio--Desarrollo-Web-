<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIncietec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bgIncietec)" />

  <!-- Grid lines background effect -->
  <path d="M 0 60 H 600 M 0 120 H 600 M 0 180 H 600 M 0 240 H 600 M 0 300 H 600" stroke="#334155" stroke-width="0.8" opacity="0.3"/>
  <path d="M 100 0 V 360 M 200 0 V 360 M 300 0 V 360 M 400 0 V 360 M 500 0 V 360" stroke="#334155" stroke-width="0.8" opacity="0.3"/>

  <!-- Browser Window Mockup -->
  <rect x="70" y="45" width="460" height="270" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <!-- Browser topbar -->
  <rect x="70" y="45" width="460" height="34" rx="12" fill="#1e293b" />
  <circle cx="95" cy="62" r="5" fill="#ef4444" />
  <circle cx="112" cy="62" r="5" fill="#f59e0b" />
  <circle cx="129" cy="62" r="5" fill="#10b981" />
  <rect x="150" y="53" width="220" height="18" rx="4" fill="#0f172a" />
  <text x="160" y="66" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">incietec-salud-ets.org/prevencion</text>

  <!-- Web Content Area -->
  <rect x="90" y="95" width="420" height="70" rx="8" fill="url(#screenGrad)" opacity="0.85" />
  <text x="115" y="125" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Portal Educativo INCIETEC</text>
  <text x="115" y="145" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e0f2fe">Prevención, Concientización y Salud Sexual Integral</text>

  <!-- Health Shield & Heart Icon -->
  <g transform="translate(425, 105)">
    <circle cx="25" cy="25" r="24" fill="#ffffff" opacity="0.2"/>
    <path d="M 25 10 C 15 10, 10 18, 10 26 C 10 38, 25 46, 25 46 C 25 46, 40 38, 40 26 C 40 18, 35 10, 25 10 Z" fill="url(#heartGrad)"/>
    <path d="M 22 23 H 28 M 25 20 V 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Cards Grid Inside Mockup -->
  <rect x="90" y="180" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="195" width="40" height="8" rx="3" fill="#38bdf8"/>
  <rect x="100" y="212" width="110" height="6" rx="2" fill="#64748b"/>
  <rect x="100" y="225" width="90" height="6" rx="2" fill="#475569"/>
  <rect x="100" y="255" width="60" height="18" rx="4" fill="#0284c7"/>

  <rect x="235" y="180" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="245" y="195" width="45" height="8" rx="3" fill="#10b981"/>
  <rect x="245" y="212" width="110" height="6" rx="2" fill="#64748b"/>
  <rect x="245" y="225" width="85" height="6" rx="2" fill="#475569"/>
  <rect x="245" y="255" width="60" height="18" rx="4" fill="#059669"/>

  <rect x="380" y="180" width="130" height="110" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="390" y="195" width="50" height="8" rx="3" fill="#f43f5e"/>
  <rect x="390" y="212" width="110" height="6" rx="2" fill="#64748b"/>
  <rect x="390" y="225" width="95" height="6" rx="2" fill="#475569"/>
  <rect x="390" y="255" width="60" height="18" rx="4" fill="#e11d48"/>
</svg>
