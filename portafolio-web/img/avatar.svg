<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="50%" stop-color="#6610f2" />
      <stop offset="100%" stop-color="#0dcaf0" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#212529" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#343a40" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="176" fill="url(#circleGrad)" filter="url(#shadow)" />

  <!-- Code Decorators -->
  <path d="M 90 170 L 60 200 L 90 230" stroke="#0dcaf0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <path d="M 310 170 L 340 200 L 310 230" stroke="#6610f2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <line x1="220" y1="80" x2="180" y2="120" stroke="#0d6efd" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Developer Silhouette / Monogram Shape -->
  <circle cx="200" cy="155" r="55" fill="#f8f9fa" opacity="0.95" />
  <path d="M 115 300 C 115 235, 150 220, 200 220 C 250 220, 285 235, 285 300 Z" fill="#f8f9fa" opacity="0.95" />

  <!-- Initials Badge / Monogram in lower chest -->
  <rect x="155" y="240" width="90" height="42" rx="10" fill="#0d6efd" />
  <text x="200" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">EG</text>

  <!-- Tech Dots / Circuit Nodes -->
  <circle cx="110" cy="120" r="6" fill="#0dcaf0" />
  <circle cx="290" cy="120" r="6" fill="#6610f2" />
  <circle cx="200" cy="340" r="6" fill="#0d6efd" />
</svg>
